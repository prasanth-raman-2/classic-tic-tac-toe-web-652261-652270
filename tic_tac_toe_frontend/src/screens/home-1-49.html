<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Home</title>
    <link rel="stylesheet" href="../styles/design-system.css">
    <link rel="stylesheet" href="../styles/home-1-49.css">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@500&family=Roboto:wght@500&family=Inter:wght@500&display=swap" rel="stylesheet">
    <script src="../app.js" defer></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="search-bar">
                <input type="text" placeholder="Search">
                <button class="search-icon">
                    <img src="../assets/components/component_1:61_search.png" alt="Search">
                </button>
            </div>
            <button class="settings-icon">
                <img src="../assets/components/component_1:59_settings-sliders.png" alt="Settings">
            </button>
        </header>

        <main class="main-content">
            <section class="games-grid">
                <!-- Grid of game cards will be dynamically populated -->
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active">
                <img src="../assets/components/component_1:123_home.png" alt="Home">
            </button>
            <button class="nav-item">
                <img src="../assets/components/component_1:124_user.png" alt="Profile">
            </button>
            <button class="nav-item">
                <img src="../assets/components/component_1:125_comment.png" alt="Chat">
            </button>
        </nav>
    </div>
</body>
</html>
